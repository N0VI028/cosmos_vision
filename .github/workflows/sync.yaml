name: sync

on:
  workflow_run:
    workflows:
      - Build Dist
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: kujov/gitlab-sync@ec05efff6dfa33ffb5398d31caf3a256e5a9ea34 # 2.0.0
        with:
          gitlab_url: https://gitlab.com/novi028/cosmos_vision.git
          username: novi028
          gitlab_pat: ${{ secrets.GITLAB_PAT }}
